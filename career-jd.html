<!DOCTYPE html>
<html lang="zh-TW">
<head>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%220.9em%22 font-size=%2290%22>🔎</text></svg>">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JD 初判</title>
<style>
:root{
  --bg:#e8e4de;--bg2:#ede9e3;--card:#f4f1ec;
  --ink:#28261f;--sub:#55514a;--faint:#7a7570;
  --border:rgba(40,38,32,.09);--bstr:rgba(40,38,32,.16);
  --shadow:0 1px 4px rgba(40,38,32,.07);
  --ac:#4a6a8a;--ac-l:#5a80a4;--ac-tint:rgba(74,106,138,.08);--ac-tint2:rgba(74,106,138,.16);
  --fs0:18px;--fs1:15px;--fs2:13px;--fs3:12px;--fs4:11px;
  --warn:#8a5a20;--warn-bg:rgba(190,120,40,.14);--ok:#3d7a5a;--ok-bg:rgba(61,122,90,.14);
  --bad:#8a4a30;--bad-bg:rgba(176,96,50,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue','PingFang TC',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;font-size:var(--fs2);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;color:inherit}
.nav{position:sticky;top:0;z-index:100;background:rgba(232,228,222,.93);backdrop-filter:blur(18px);border-bottom:1px solid var(--bstr);display:flex;align-items:center;padding:0 16px}
.nav-title{font-size:var(--fs1);font-weight:700;color:var(--ac);padding:13px 0;letter-spacing:.02em;white-space:nowrap}
.back-link{margin-left:auto;font-size:var(--fs3);color:var(--faint);text-decoration:none;padding:5px 9px;border-radius:6px;transition:background .15s;white-space:nowrap}
.back-link:hover{background:rgba(40,38,32,.07);color:var(--ink)}
.wrap{padding:22px 16px 96px;max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:.5px solid var(--bstr);border-radius:14px;padding:16px 18px;box-shadow:var(--shadow)}
.card h2{font-size:var(--fs1);font-weight:700;margin-bottom:8px}
.st{font-size:var(--fs3);line-height:1.6;color:var(--sub)}
.st.ok{color:var(--ok)}.st.err{color:var(--bad)}
.st details{margin-top:6px}
.st summary{cursor:pointer;color:var(--ac)}
.st pre{white-space:pre-wrap;word-break:break-word;font-family:inherit;font-size:var(--fs3);color:var(--sub);background:var(--bg2);border-radius:8px;padding:10px;margin-top:6px;max-height:320px;overflow:auto}
.btn{font-size:var(--fs2);font-weight:600;color:#fff;background:var(--ac);border:none;border-radius:8px;padding:9px 18px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn-sm{font-size:var(--fs3);font-weight:600;color:var(--ac);background:var(--ac-tint);border:1px solid var(--ac-tint2);border-radius:6px;padding:4px 10px;cursor:pointer;margin-left:6px}
label{display:block;font-size:var(--fs3);font-weight:600;color:var(--sub);margin:10px 0 4px}
input[type=text],input[type=password],textarea{width:100%;font-size:var(--fs2);background:var(--bg2);border:1px solid var(--bstr);border-radius:8px;padding:9px 11px;outline:none}
input:focus,textarea:focus{border-color:var(--ac)}
textarea{min-height:calc(1.5em * 16 + 20px);line-height:1.5;resize:vertical}
.hint{font-size:var(--fs4);color:var(--faint);margin-top:4px}
.hint.warn{color:var(--warn)}
.keybox{display:none;margin-top:12px;background:var(--warn-bg);border-radius:8px;padding:10px 12px;font-size:var(--fs3);color:var(--warn)}
.keybox .row{display:flex;gap:6px;margin-top:6px}
.lv{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0 6px}
.pill{display:inline-block;font-size:var(--fs3);font-weight:600;color:var(--ac);background:var(--ac-tint);border-radius:100px;padding:3px 11px}
.pill.go{color:var(--ok);background:var(--ok-bg)}
.pill.nogo{color:var(--bad);background:var(--bad-bg)}
.pill.dis{color:var(--bad);background:var(--bad-bg);font-weight:600}
.pill.dis.minor{background:transparent;border:1px solid var(--bad-bg)}
ul.rs{margin:0 0 0 18px;display:flex;flex-direction:column;gap:7px;line-height:1.6;font-size:var(--fs2)}
.kw-rows{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.kw-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs2)}
.kw-term{flex:1;min-width:80px;word-break:break-word}
.pv{display:inline-flex;gap:4px}
.pvb{font-size:var(--fs3);font-weight:700;min-width:32px;padding:4px 8px;border-radius:6px;border:1px solid var(--bstr);background:var(--bg2);color:var(--sub);cursor:pointer}
.pvb.on.like{background:var(--ok);border-color:var(--ok);color:#fff}
.pvb.on.neutral{background:var(--ac);border-color:var(--ac);color:#fff}
.pvb.on.dislike{background:var(--bad);border-color:var(--bad);color:#fff}
.pref-sum{cursor:pointer;font-size:var(--fs1);font-weight:700}
#pref-panel details{margin-top:0}
.kw-row.hl{background:var(--ac-tint2);border-radius:6px}
.pref-grp{margin:0 0 4px 12px;padding-left:10px;border-left:2px solid var(--bstr);display:flex;flex-direction:column;gap:2px}
.pref-grp .kw-row,#kw-rows .kw-row{padding:3px 6px;border-radius:6px}
#kw-rows{gap:2px}
#kw-rows .pill{min-width:76px;text-align:center}
.pref-grp .kw-row:nth-child(even),#kw-rows .kw-row:nth-child(even){background:var(--bg2)}
.pref-grp .kw-row:hover,#kw-rows .kw-row:hover{background:var(--ac-tint)}
.pref-grp .kw-row.hl,#kw-rows .kw-row.hl{background:var(--ac-tint2)}
.pref-grp .kw-term,#kw-rows .kw-term{display:flex;align-items:center}
.pref-grp .kw-term::after,#kw-rows .kw-term::after{content:'';flex:1;min-width:12px;margin:0 6px 0 10px;border-bottom:1px dotted var(--bstr)}
.mtag{font-size:var(--fs4);color:var(--faint);margin-left:4px}
.add-kw{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:10px}
.add-kw input[type=text]{flex:1;min-width:140px;width:auto;padding:6px 9px}
.add-kw select{font-size:var(--fs2);background:var(--bg2);border:1px solid var(--bstr);border-radius:8px;padding:6px 8px}
.add-kw .btn-sm{margin-left:0}
.loc-addr{font-size:var(--fs2);font-weight:600;margin-top:2px}
.sub-h{font-size:var(--fs3);font-weight:700;color:var(--sub);margin:10px 0 3px}
.note{font-size:var(--fs4);color:var(--faint);margin-top:6px}
.links{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.links a{font-size:var(--fs3);color:var(--ac);background:var(--ac-tint);border:1px solid var(--ac-tint2);border-radius:6px;padding:4px 10px;text-decoration:none}
.links a:hover{background:var(--ac-tint2)}
.jdzh{line-height:1.7;word-break:break-word;font-size:var(--fs2)}
.chat-log{display:flex;flex-direction:column;gap:7px;margin:10px 0 8px;max-height:420px;overflow-y:auto}
.chat-log:empty{display:none}
.chat-msg{font-size:12.5px;line-height:1.6;padding:7px 11px;border-radius:9px;max-width:92%;white-space:pre-wrap;word-break:break-word}
.chat-user{align-self:flex-end;background:rgba(40,38,32,.06);color:var(--sub)}
.chat-ai{align-self:flex-start;background:var(--ac-tint);color:var(--ink)}
.chat-sys{align-self:center;background:var(--warn-bg);color:var(--warn);font-size:var(--fs3)}
.chat-row{display:flex;gap:8px;align-items:flex-end;margin-top:8px}
.chat-in{flex:1;min-height:0;height:58px;resize:vertical;font-size:var(--fs2)}
.chat-sum{cursor:pointer;font-size:var(--fs3);font-weight:700;color:var(--sub)}
.chat-hint{margin-top:10px;font-size:var(--fs3);color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:8px 11px}
#chat-reeval.hot{background:var(--warn);box-shadow:0 0 0 3px var(--warn-bg)}
</style>
</head>
<body>
<div class="nav">
  <div class="nav-title">🔎 JD 初判</div>
  <a class="back-link" href="./career-matrix.html">← Career</a>
</div>
<div class="wrap">
  <div class="card">
    <h2>履歷來源</h2>
    <div class="st" id="resume-st">讀取 NexusPortal 履歷中…</div>
  </div>
  <div class="card">
    <h2>貼上職缺</h2>
    <label for="opp">Opportunity name</label>
    <input type="text" id="opp" placeholder="例如：某公司 Supply Chain Manager" autocomplete="off">
    <label for="jd">JD content</label>
    <textarea id="jd" placeholder="把職缺說明（JD）整段貼上，中英文皆可，長文也沒問題"></textarea>
    <div class="hint" id="jd-hint"></div>
    <div class="keybox" id="key-notice">尚未設定 Groq API key，請輸入後儲存。
      <div class="row"><input type="password" id="inline-key" placeholder="gsk_..." autocomplete="off"><button type="button" class="btn-sm" onclick="saveInlineKey()">儲存</button></div>
    </div>
    <div style="margin-top:14px"><button type="button" class="btn" id="go-btn" onclick="runAnalysis()" disabled>開始初判</button>
      <span class="st" id="run-st" role="status" aria-live="polite" style="margin-left:10px"></span></div>
  </div>
  <div id="out" style="display:none;flex-direction:column;gap:14px"></div>
  <div id="pref-panel"></div>
</div>
<script>
'use strict';
const NEXUS_URL = 'https://nexus-portal-epq.pages.dev/';
const RESUME_LIMIT = 4500;
const RESUME_TOKEN_LIMIT = 2200; // 履歷估算 token 上限（全中文履歷 4500 字約 4300 token，會擠掉 JD 預算）
const TPM_SAFE = 7300;   // Groq 免費檔每分鐘 token 安全線（額度約 8K）
const ANALYZE_MAX = 3000; // 分析輸出 max_tokens（11-04 加工作地點 2600→2800、加 pref_hits →3000）
const JD_LIMIT = 6000; // Groq 免費檔 gpt-oss-120b 約 8K TPM：履歷約 4400 字＋JD＋輸出須壓在一分鐘額度內
let resumeText = '';
let resumeStat = null;
let resumeLoading = false;
let busy = false;

//JD_FN_START
const CJK_RE = /[\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uff00-\uffef]/;
function estTokens(s){
  let cjk = 0, other = 0;
  for(const ch of String(s==null?'':s)){ if(CJK_RE.test(ch)) cjk++; else other++; }
  return Math.ceil(cjk*0.95 + other*0.25);
}
function truncJd(s, budget){
  s = String(s==null?'':s).slice(0, JD_LIMIT);
  let acc = 0, i = 0;
  for(const ch of s){
    acc += CJK_RE.test(ch) ? 0.95 : 0.25;
    if(Math.ceil(acc) > budget) break;
    i += ch.length;
  }
  return s.slice(0, i);
}
function isChineseJd(s){
  const t = String(s==null?'':s).replace(/\s+/g,'');
  if(!t) return false;
  let c = 0, n = 0;
  for(const ch of t){ n++; if(CJK_RE.test(ch)) c++; }
  return c/n >= 0.5;
}
//JD_FN_END
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function t2(s){ s = String(s==null?'':s); return (typeof s2t==='function') ? s2t(s) : s; }

// ── 履歷擷取與精簡 ──
//RESUME_FN_START
function extractNexusData(html){
  const key = 'var NEXUS_BAKED_DATA = ';
  const i = html.indexOf(key);
  if(i < 0) throw new Error('找不到履歷資料');
  const from = i + key.length;
  const j = html.indexOf(';\n', from);
  if(j < 0) throw new Error('履歷資料格式異常');
  return JSON.parse(html.slice(from, j));
}
function cutStr(s, n){ s = String(s==null?'':s).replace(/\s+/g,' ').trim(); return s.length>n ? s.slice(0,n-1)+'…' : s; }
function buildResume(data, limit){
  limit = limit || 4500;
  const nodes = (data.nodes||[]).filter(n=>n && n.track==='engineering')
    .slice().sort((a,b)=>(Number(a.year)||0)-(Number(b.year)||0) || (Number(a.month)||0)-(Number(b.month)||0));
  const lens = (data.lensProfiles && data.lensProfiles.engineering) || {};
  const head = [];
  if(lens.role) head.push('定位：'+cutStr(lens.role,100));
  if(lens.description) head.push('簡介：'+cutStr(lens.description,500));
  const expFull = nodes.map(n=>{
    const st = n.star||{};
    let l = n.year+'｜'+cutStr(n.company,60)+'｜'+cutStr(n.title,60)+'：'+cutStr(st.R,160);
    if(st.A) l += '（A：'+cutStr(st.A,100)+'）';
    return l;
  });
  const expShort = nodes.map(n=>{
    const st = n.star||{};
    return n.year+'｜'+cutStr(n.company,60)+'｜'+cutStr(n.title,60)+'：'+cutStr(st.R,120);
  });
  const ach = [];
  (data.engHashtags||[]).forEach(h=>{
    (h.items||[]).forEach(it=>{
      if(!it || it.visible===false) return;
      const co = (it.showCompany===false) ? '' : (it.company ? '['+cutStr(it.company,40)+'] ' : '');
      ach.push('#'+cutStr(h.tag,30)+'：'+co+cutStr(it.result,220));
    });
  });
  let truncated = false;
  const assemble = (exp, ac)=>[].concat(head, exp.length?['【經歷】']:[], exp, ac.length?['【成就】']:[], ac).join('\n');
  let exp = expFull, ac = ach.slice(), text = assemble(exp, ac);
  const over = t => t.length > limit || estTokens(t) > RESUME_TOKEN_LIMIT - 8; // 預留「已截斷」註記
  if(over(text)){
    truncated = true;
    while(ac.length && over(text)){ ac.pop(); text = assemble(exp, ac); }
    if(over(text)){ exp = expShort; text = assemble(exp, ac); }
    if(text.length > limit){ text = text.slice(0, limit-1)+'…'; }
    while(over(text) && text.length > 20){ text = text.slice(0, Math.floor(text.length*0.95))+'…'; }
  }
  if(truncated) text += '\n（已截斷）';
  return {text, truncated, expCount: nodes.length, achCount: ach.length, achUsed: ac.length};
}
//RESUME_FN_END

async function loadResume(){
  if(resumeLoading) return;
  resumeLoading = true;
  const st = document.getElementById('resume-st');
  st.className = 'st'; st.textContent = '讀取 NexusPortal 履歷中…';
  document.getElementById('go-btn').disabled = true;
  const ctl = new AbortController();
  const tm = setTimeout(()=>ctl.abort(), 15000);
  try{
    const r = await fetch(NEXUS_URL, {cache:'no-store', signal: ctl.signal});
    if(!r.ok) throw new Error('HTTP '+r.status);
    const html = await r.text();
    const res = buildResume(extractNexusData(html), RESUME_LIMIT);
    resumeText = res.text; resumeStat = res;
    st.className = 'st ok'; st.textContent = '';
    const line = document.createElement('div');
    line.textContent = '已讀取 NexusPortal 履歷：'+res.expCount+' 段經歷、'+res.achCount+' 筆成就'+(res.truncated?'（已截斷）':'');
    const det = document.createElement('details');
    const sm = document.createElement('summary'); sm.textContent = '查看送給 AI 的履歷摘要';
    const pre = document.createElement('pre'); pre.textContent = res.text;
    det.appendChild(sm); det.appendChild(pre);
    st.appendChild(line); st.appendChild(det);
    updateBtn(); onJdInput();
  }catch(e){
    resumeText = '';
    st.className = 'st err'; st.textContent = '履歷讀取失敗：'+(e.name==='AbortError'?'逾時（15 秒）':e.message);
    const b = document.createElement('button'); b.type='button'; b.className='btn-sm'; b.textContent='重試';
    b.onclick = loadResume; st.appendChild(b);
  }finally{ clearTimeout(tm); resumeLoading = false; }
}

// ── Groq ──
function getKey(){ return localStorage.getItem('groq_key')||localStorage.getItem('tina_groq')||localStorage.getItem('oasis_groq_key')||''; }
function checkKey(){ document.getElementById('key-notice').style.display = getKey() ? 'none' : 'block'; }
function saveInlineKey(){
  const v = document.getElementById('inline-key').value.trim();
  if(!v) return;
  localStorage.setItem('groq_key', v);
  document.getElementById('inline-key').value = '';
  checkKey();
}
const GROQ_PRIMARY_MODEL = 'openai/gpt-oss-120b';
const GROQ_BACKUP_MODEL = 'openai/gpt-oss-20b';
async function _groqOnce(model, m, msgs, jsonMode, k){
  const r = await fetch('https://api.groq.com/openai/v1/chat/completions',{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+k},
    body:JSON.stringify({model,messages:msgs,max_tokens:m,temperature: jsonMode ? 0.3 : 0.4,reasoning_effort:'low'})
  });
  if(!r.ok){
    let detail='';
    try{ const ej=await r.json(); detail=(ej&&ej.error&&ej.error.message)||''; }catch(_e){}
    const err = new Error('API '+r.status+(detail?'：'+detail:''));
    err.status = r.status; err.detail = detail;
    throw err;
  }
  const j = await r.json();
  const ch = j.choices && j.choices[0];
  return {content: (ch&&ch.message&&ch.message.content)||'', finishReason: ch&&ch.finish_reason};
}
function _modelDown(e){ return e.status >= 500 || /decommission|not[ _-]?found|does not exist|invalid model|model_not_active/i.test(e.detail||''); }
let lastFinish = ''; // 最近一次 Groq 呼叫（含加大重試後）的 finish_reason
async function callGroqRaw(prompt, max, sys, jsonMode){
  const k = getKey();
  if(!k){ checkKey(); throw new Error('尚未設定 Groq API key'); }
  const msgs = [{role:'system',content:sys},{role:'user',content:prompt}];
  let model = GROQ_PRIMARY_MODEL, res;
  try{ res = await _groqOnce(model, max, msgs, jsonMode, k); }
  catch(e){ if(!_modelDown(e)) throw e; model = GROQ_BACKUP_MODEL; res = await _groqOnce(model, max, msgs, jsonMode, k); }
  if(res.finishReason === 'length'){ res = await _groqOnce(model, Math.max(max, Math.min(Math.round(max*1.8), TPM_SAFE - estTokens(sys+prompt))), msgs, jsonMode, k); }
  lastFinish = res.finishReason || '';
  return res.content;
}
function sleep(ms){ return new Promise(r=>setTimeout(r,ms)); }
// 429：顯示倒數 60 秒後重試一次
async function callGroq(prompt, max, sys, jsonMode){
  try{ return await callGroqRaw(prompt, max, sys, jsonMode); }
  catch(e){
    if(e.status === 413) throw new Error('請求太大，超過 Groq 免費額度，請縮短 JD 後重試');
    if(e.status !== 429) throw e;
    const st = document.getElementById('run-st');
    for(let s=60; s>0; s--){ st.textContent = 'Groq 額度忙碌，'+s+' 秒後自動重試'; await sleep(1000); }
    st.textContent = '重試中…';
    return await callGroqRaw(prompt, max, sys, jsonMode);
  }
}
function safeParseJson(raw){
  const cleaned = raw.replace(/[\x00-\x08\x0b\x0c\x0e-\x1f\x7f]/g,' ');
  const m = cleaned.match(/\{[\s\S]*\}/);
  if(!m) throw new Error('格式解析失敗，請重試');
  return JSON.parse(m[0]);
}

// ── 討論聊天：prompt 組裝與回覆解析（純函式，不碰 DOM）──
//CHAT_FN_START
const CHAT_MAX = 900;        // 聊天回覆 max_tokens（gpt-oss 隱藏推理會吃預算，至少 900）
const CHAT_JD_MIN = 400;     // JD 至少保留的估算 token，低於此才開始丟最舊對話
const CHAT_ROUNDS = 6;       // 最近幾輪（一輪＝使用者＋顧問）
const CHAT_FACT_MAX = 15, CHAT_FACT_LEN = 80;
const SYS_CHAT = '你是資深求職顧問，正與使用者討論一份職缺。依【履歷】【JD】【目前初判】回答使用者的提問；使用台灣繁體中文與台灣用語，簡潔條列，reply 不超過 250 字；不得捏造履歷或 JD 沒有的內容。只輸出一個合法 JSON 物件，不要任何其他文字。';
function chatBrief(a){
  a = (a && typeof a === 'object') ? a : {};
  const arr = x => (Array.isArray(x) ? x : []).map(s=>cutStr(s, 80)).filter(Boolean);
  const vd = String(a.verdict||'').trim().toLowerCase() === 'go' ? 'Go' : 'No-go';
  const lv = normLevel(a.level) || '—';
  return '判定：'+vd+'；符合度：'+lvOk(a.fit_level)+'；發展性：'+lvOk(a.growth_level)+'；職級：'+lv
    +'\n結論要點：'+arr(a.summary_points).slice(0,3).join('；')
    +'\n理由：'+arr(a.reasons).slice(0,7).join('；');
}
function chatBuild(resume, jdRaw, a, prefs, facts, msgs){
  const budget = TPM_SAFE - CHAT_MAX;
  const hist = (Array.isArray(msgs)?msgs:[]).slice(-CHAT_ROUNDS*2);
  const factsTxt = (facts&&facts.length) ? facts.map((f,i)=>(i+1)+'. '+f).join('\n') : '（無）';
  const brief = chatBrief(a);
  const pf = String(prefs||'').slice(0,900);
  let res = truncJd(resume, 1500);
  const tail = '只回 JSON，格式：\n'
    +'{"reply":"給使用者的回答","facts":["本輪使用者提供、會影響評估的新事實，一句一條，每條不超過 60 字；沒有就空陣列"],"reeval":true或false,"reeval_reason":"為什麼建議重新評估（一句；reeval 為 false 時給空字串）"}\n'
    +'規則：\n1. facts 只收使用者本人說出的事實（經歷、偏好、限制、對職位的新資訊），不收你的推測或建議，也不重複【使用者補充】已有的。\n'
    +'2. 只有當新事實可能改變 Go／No-go、職級、符合度或發展性判斷時，reeval 才給 true。\n3. reply 針對使用者本輪提問直接回答。';
  const assemble = (jd, h, r) => '【履歷摘要】\n'+r+'\n\n【JD】\n'+jd+'\n\n【目前初判】\n'+brief
    +'\n\n【使用者關鍵點偏好】\n'+pf+'\n\n【使用者補充】\n'+factsTxt
    +'\n\n【對話紀錄（最後一則是使用者本輪提問）】\n'
    +h.map(m=>(m.role==='user'?'使用者：':'顧問：')+cutStr(m.content, m.role==='user'?500:400)).join('\n')+'\n\n'+tail;
  let start = 0, jdB;
  for(;;){
    jdB = budget - estTokens(SYS_CHAT + assemble('', hist.slice(start), res));
    if(jdB >= CHAT_JD_MIN || start >= hist.length-1) break;
    start++;
  }
  if(jdB < 0){ res = truncJd(resume, 500); jdB = budget - estTokens(SYS_CHAT + assemble('', hist.slice(start), res)); }
  const prompt = assemble(truncJd(jdRaw, Math.max(0, jdB)), hist.slice(start), res);
  return {sys:SYS_CHAT, prompt, est:estTokens(SYS_CHAT+prompt), dropped:start};
}
function cleanFact(x){
  if(x==null || typeof x==='object') return '';
  let s = String(x).replace(/\s+/g,' ').trim();
  if(s.length > CHAT_FACT_LEN) s = s.slice(0, CHAT_FACT_LEN);
  return s;
}
function mergeFacts(list, incoming){
  const out = Array.isArray(list) ? list.slice() : [];
  const seen = new Set(out.map(normTerm));
  (Array.isArray(incoming)?incoming:[]).forEach(x=>{
    const s = cleanFact(x), k = normTerm(s);
    if(!s || seen.has(k) || out.length >= CHAT_FACT_MAX) return;
    seen.add(k); out.push(s);
  });
  return out;
}
// 回傳 {reply, facts[], reeval, reason}；解析失敗或 reply 空 → reply 為空字串（呼叫端顯示錯誤）
function parseChatReply(raw){
  const r = {reply:'', facts:[], reeval:false, reason:''};
  let o = null;
  try{ o = safeParseJson(String(raw==null?'':raw)); }catch(_e){ return r; }
  if(!o || typeof o !== 'object') return r;
  if(typeof o.reply === 'string') r.reply = t2(o.reply.trim());
  r.facts = (Array.isArray(o.facts) ? o.facts : []).map(x=>t2(cleanFact(x))).filter(Boolean);
  r.reeval = o.reeval === true;
  if(typeof o.reeval_reason === 'string') r.reason = t2(cutStr(o.reeval_reason, 100));
  return r;
}
// 60 秒滑動窗口記帳：log＝[{t(ms), tok}]；回傳還需等待的毫秒數（0＝可立即送）
const QUOTA_WINDOW_MS = 60000;
function quotaWaitMs(log, now, need){
  const live = (Array.isArray(log)?log:[]).filter(e=>e && now - e.t < QUOTA_WINDOW_MS).sort((a,b)=>a.t-b.t);
  let used = live.reduce((n,e)=>n+e.tok, 0), i = 0;
  if(used + need <= TPM_SAFE) return 0;
  while(i < live.length && used + need > TPM_SAFE){ used -= live[i].tok; i++; }
  return Math.max(0, live[i-1].t + QUOTA_WINDOW_MS - now) + 500;
}

const PREF_KEY = 'cc_career_jd_prefs_v1';

const LEVELS = {junior:'Junior', senior:'Senior', manager:'Manager'};

function normTerm(s){ return String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,' '); }
function validDate(x){
  if(typeof x !== 'string') return false;
  const m = x.match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!m) return false;
  const y = +m[1], mo = +m[2], d = +m[3];
  return mo >= 1 && mo <= 12 && d >= 1 && d <= new Date(Date.UTC(y, mo, 0)).getUTCDate();
}
function parsePrefs(str){
  const out = Object.create(null);
  let o;
  try{ o = JSON.parse(str); }catch(_e){ return out; }
  if(!o || typeof o !== 'object' || Array.isArray(o) || o.version !== 1) return out;
  const p = o.prefs;
  if(!p || typeof p !== 'object' || Array.isArray(p)) return out;
  let n = 0;
  Object.keys(p).forEach(k=>{
    if(n >= 500) return;
    const e = p[k];
    if(!e || typeof e !== 'object' || Array.isArray(e)) return;
    if(typeof e.term !== 'string') return;
    const term = e.term.trim();
    if(!term || term.length > 30) return;
    if(PREF_CATS.indexOf(e.cat) < 0 || PREF_VS.indexOf(e.v) < 0) return;
    if(!validDate(e.at)) return;
    const it = {term, cat:e.cat, v:e.v, at:e.at};
    if(e.src === 'manual') it.src = 'manual';
    out[normTerm(term)] = it;
    n++;
  });
  return out;
}

function setPref(term, cat, v, src){

  else{
    const it = {term: String(term).trim().slice(0,30), cat: PREF_CATS.indexOf(cat)>=0?cat:'其他', v, at: localToday()};
    if(src === 'manual' || (m[key] && m[key].src === 'manual')) it.src = 'manual';
    m[key] = it;

  refreshPrefUi();
}

// 翻譯結果：優先解析 sections JSON；失敗退回純文字（去行首符號、統一縮排）
function plainZh(raw){
  return String(raw).split('\n').map(l=>{
    const m = l.match(/^(\s*)[*\-•·]+\s+(.*)$/);
    return m ? '  '+m[2] : l.replace(/^\s+/,'');
  }).join('\n').trim();
}
function renderZh(raw){
  const el = document.getElementById('jd-zh');
  el.textContent = '';
  let secs = null;
  try{
    const o = safeParseJson(raw);
    if(o && Array.isArray(o.sections) && o.sections.length) secs = o.sections;
  }catch(_e){}
  if(secs){
    secs.forEach(s=>{
      if(!s || typeof s !== 'object') return;
      if(s.title && String(s.title).trim()) el.appendChild(mk('div','sub-h',t2(String(s.title))));
      addUl(el, s.items);
    });
    el.style.whiteSpace = 'normal';
    if(el.childNodes.length) return;
  }
  el.style.whiteSpace = 'pre-wrap';
  el.textContent = t2(plainZh(raw));
}

const SYS_ANALYZE = '你是資深求職顧問。只輸出一個合法 JSON 物件，不要任何其他文字。所有中文欄位一律使用台灣繁體中文與台灣用語。';

function jdBudget(opp, rawJd){
  if(opp == null) opp = ((document.getElementById('opp')||{}).value || '').trim();
  if(rawJd == null) rawJd = ((document.getElementById('jd')||{}).value || '').trim();
  const fixed = estTokens(analyzePrompt(opp, '', rawJd) + SYS_ANALYZE);
  return Math.max(800, TPM_SAFE - ANALYZE_MAX - fixed);
}
let lastGroqAt = 0, curOpp = '', curJd = '', curJdRaw = '';
const usageLog = [];   // 所有 Groq 呼叫（分析／翻譯／聊天）共用的 token 記帳
async function gcall(prompt, max, sys, jsonMode){
  try{
    const out = await callGroq(prompt, max, sys, jsonMode);
    usageLog.push({t:Date.now(), tok:estTokens(prompt+sys)+max});
    if(usageLog.length > 50) usageLog.shift();
    return out;
  }
  finally{ lastGroqAt = Date.now(); }
}
// 聊天專用：窗口內已用＋本次估算 ≤ TPM_SAFE 就立刻送，否則倒數到足夠舊紀錄滑出
async function waitQuotaTokens(st, need){
  for(;;){
    const ms = quotaWaitMs(usageLog, Date.now(), need);
    if(ms <= 0) return;
    st.textContent = '等待額度釋放，'+Math.ceil(ms/1000)+' 秒後送出';
    await sleep(Math.min(ms, 1000));
  }
}
async function waitQuota(st){
  for(let s=Math.ceil((65000-(Date.now()-lastGroqAt))/1000); s>0; s--){
    st.textContent = '距上次 AI 呼叫未滿 65 秒，'+s+' 秒後送出'; await sleep(1000);
  }
}
async function doAnalyze(opp, jd, rawJd){
  const raw = await gcall(analyzePrompt(opp, jd, rawJd), ANALYZE_MAX, SYS_ANALYZE, true);
  const a = safeParseJson(raw);
  const vd = String(a.verdict||'').trim().toLowerCase();
  if(vd !== 'go' && vd !== 'no-go') throw new Error('AI 回傳的判定格式不正確，請重試');
  return applyPrefRule(a);
}
// 11-04 使用者訂：扣分項是這份職缺的核心工作 → 程式直接改判 No-go；次要 → 維持 AI 判定但標出
// dis_hits／forced／ai_verdict 一律由程式覆寫，不採信 AI 回傳的同名欄位
function applyPrefRule(a){
  const m = loadPrefs(), seen = Object.create(null), hits = [];
  const find = t => { const k1 = normTerm(t), k2 = normTerm(t2(t)); return m[k1] ? [k1, m[k1]] : (m[k2] ? [k2, m[k2]] : null); };
  (Array.isArray(a.pref_hits) ? a.pref_hits : []).slice(0,40).forEach(h=>{
    if(!h || typeof h !== 'object' || typeof h.term !== 'string') return;
    const f = find(h.term.slice(0,60));
    if(!f || f[1].v !== 'dislike' || f[1].cat === '職級' || seen[f[0]]) return;
    seen[f[0]] = 1;
    hits.push({term: f[1].term, core: h.weight === 'core'});
  });
  const lv = normLevel(a.level);
  if(lv){ const f = find(lv); if(f && f[1].v === 'dislike' && !seen[f[0]]){ seen[f[0]] = 1; hits.push({term: lv, core: true}); } }
  hits.sort((x,y)=> (y.core?1:0) - (x.core?1:0));
  a.dis_hits = hits;
  a.ai_verdict = String(a.verdict||'').trim().toLowerCase();
  a.forced = a.ai_verdict === 'go' && hits.some(h=>h.core);
  if(a.forced) a.verdict = 'no-go';
  return a;
}
async function runAnalysis(){
  if(busy) return;
  const opp = document.getElementById('opp').value.trim();
  const jdRaw = document.getElementById('jd').value.trim();
  const st = document.getElementById('run-st');
  if(!opp || !jdRaw){ st.textContent = 'Opportunity name 與 JD content 都必填'; return; }
  if(!resumeText){ st.textContent = '履歷尚未讀取成功'; return; }
  if(!getKey()){ checkKey(); st.textContent = '請先設定 Groq API key'; return; }
  resetChat(); onJdInput();   // 換 JD 重新分析：先清空聊天與補充（analyzePrompt 會讀 chatFacts）
  const jd = truncJd(jdRaw, jdBudget(opp, jdRaw));
  busy = true; updateBtn(); st.textContent = '分析中…';
  try{
    await waitQuota(st);
    st.textContent = '分析中…';
    const a = await doAnalyze(opp, jd, jdRaw);
    curOpp = opp; curJd = jd; curJdRaw = jdRaw;
    renderResult(a, opp);
    ensureZhCard(true);
    if(isChineseJd(jd)){
      const el = document.getElementById('jd-zh');
      el.textContent = ''; el.style.whiteSpace = 'normal';
      el.appendChild(mk('div','note','原文已是中文，不另翻譯'));
      jd.split(/\n\s*\n/).forEach(par=>{
        const txt = plainZh(par);
        if(!txt) return;
        const d = mk('div',null,t2(txt)); d.style.cssText = 'white-space:pre-wrap;margin-top:8px'; el.appendChild(d);
      });
      st.textContent = '完成（原文已是中文，未翻譯）';
      return;
    }
    // 與分析同一分鐘再送翻譯會疊加超過免費 TPM，比照家族慣例間隔 65 秒
    for(let s=65; s>0; s--){
      st.textContent = '分析完成，'+s+' 秒後開始翻譯（避開 Groq 每分鐘額度）';
      document.getElementById('jd-zh').textContent = '等待 '+s+' 秒後開始翻譯…';
      await sleep(1000);
    }
    st.textContent = '翻譯 JD 中…';
    document.getElementById('jd-zh').textContent = '翻譯中…';
    const zhPrompt = '請把下列職缺 JD 全文純翻譯成台灣繁體中文。依原 JD 的段落與條列結構切分，不加評論、不摘要。只回 JSON：{"sections":[{"title":"段落標題（翻成中文）","items":["條列內容"]}]}。沒有明確標題的段落，title 給空字串。\n\n'+jd;
    const zhSys = '你是專業翻譯。只輸出一個合法 JSON 物件，使用台灣繁體中文與台灣用語。';
    let max = Math.min(4500, Math.max(1500, Math.round(jd.length*1.0)));
    max = Math.max(1200, Math.min(max, TPM_SAFE - estTokens(zhPrompt + zhSys)));
    try{
      const zh = await gcall(zhPrompt, max, zhSys, true);
      renderZh(zh);
    }catch(e2){
      document.getElementById('jd-zh').textContent = '翻譯失敗：'+e2.message;
    }
    st.textContent = '完成';
  }catch(e){
    st.textContent = '失敗：'+e.message;
  }finally{ busy = false; updateBtn(); }
}
// 只重跑分析（不重跑翻譯），用最新偏好
async function rerunAnalysis(){
  if(busy || !curJd) return;
  const st = document.getElementById('run-st');
  if(!getKey()){ checkKey(); st.textContent = '請先設定 Groq API key'; return; }
  busy = true; updateBtn();
  try{
    await waitQuota(st);
    st.textContent = '依關鍵點重新分析中…';
    const jd2 = truncJd(curJdRaw, jdBudget(curOpp, curJdRaw));
    const a = await doAnalyze(curOpp, jd2, curJdRaw);
    renderResult(a, curOpp);
    st.textContent = '已依最新關鍵點偏好重新判斷';
  }catch(e){
    st.textContent = '失敗：'+e.message;
  }finally{ busy = false; updateBtn(); }
}

  if(h){ h.textContent = chatSuggest ? 'AI 建議依討論重新評估：'+chatSuggest : ''; h.style.display = chatSuggest ? 'block' : 'none'; }
}

async function sendChat(){
  if(busy || !curJd || !curAnalysis) return;
  const inp = chatEl('chat-in'), st = chatEl('chat-st');
  const text = inp.value.trim(); if(!text) return;
  if(!getKey()){ checkKey(); st.className = 'st err'; st.textContent = '請先設定 Groq API key'; return; }
  chatMsgs.push({role:'user', content:text});
  chatBubble('user', text); inp.value = '';
  busy = true; chatSending = true; st.className = 'st'; updateBtn(); updateChatBtns();
  let failMsg = '';
  try{
    const built = chatBuild(resumeText, curJdRaw, curAnalysis, prefPromptBlock(curJdRaw), chatFacts, chatMsgs);
    await waitQuotaTokens(st, built.est + CHAT_MAX);
    st.textContent = 'AI 回覆中…';
    lastFinish = '';
    const raw = await gcall(built.prompt, CHAT_MAX, built.sys, true);
    if(lastFinish === 'length') failMsg = '回覆被截斷，請再問一次或縮短問題';
    else{
      const r = parseChatReply(raw);
      if(!r.reply) failMsg = 'AI 回覆格式不正確，請再問一次';
      else{
        chatMsgs.push({role:'assistant', content:r.reply});
        chatBubble('ai', r.reply);
        chatFacts = mergeFacts(chatFacts, r.facts);
        if(r.reeval) chatSuggest = r.reason || '新補充可能改變判斷';
        renderChatFacts(); onJdInput();
        st.textContent = '';
      }
    }
  }catch(e){ failMsg = '失敗：'+e.message; }
  if(failMsg){
    chatMsgs.pop(); inp.value = text;   // 這輪不計入對話，問題放回輸入框方便重送
    chatBubble('sys', failMsg); st.textContent = '';
  }
  busy = false; chatSending = false; updateBtn(); updateChatBtns();
}
function reevalDiff(o, a){
  const g = x => String((x&&x.verdict)||'').trim().toLowerCase() === 'go' ? 'Go' : 'No-go';
  const parts = [];
  if(g(o) !== g(a)) parts.push('判定 '+g(o)+'→'+g(a));
  const lo = normLevel(o&&o.level)||'—', ln = normLevel(a&&a.level)||'—';
  if(lo !== ln) parts.push('職級 '+lo+'→'+ln);
  if(lvOk(o&&o.fit_level) !== lvOk(a.fit_level)) parts.push('符合度 '+lvOk(o&&o.fit_level)+'→'+lvOk(a.fit_level));
  if(lvOk(o&&o.growth_level) !== lvOk(a.growth_level)) parts.push('發展性 '+lvOk(o&&o.growth_level)+'→'+lvOk(a.growth_level));
  return parts.length ? parts.join('、') : '判定未改變';
}
async function reevalFromChat(){
  if(busy || !curJd || !chatFacts.length) return;
  const st = chatEl('chat-st');
  if(!getKey()){ checkKey(); st.className = 'st err'; st.textContent = '請先設定 Groq API key'; return; }
  busy = true; st.className = 'st'; updateBtn(); updateChatBtns();
  try{
    await waitQuota(st);
    st.textContent = '依討論重新評估中…';
    const old = curAnalysis;
    const a = await doAnalyze(curOpp, truncJd(curJdRaw, jdBudget(curOpp, curJdRaw)), curJdRaw);
    renderResult(a, curOpp);   // 初判卡更新；翻譯卡、聊天卡保留
    chatSuggest = '';
    chatBubble('sys', '已依討論重新評估：'+reevalDiff(old, a));
    st.textContent = '';
  }catch(e){ st.className = 'st err'; st.textContent = '失敗：'+e.message; }
  busy = false; updateBtn(); updateChatBtns();
}

document.getElementById('jd').addEventListener('input', onJdInput);
document.getElementById('opp').addEventListener('input', onJdInput);
checkKey();
renderPrefPanel();
loadResume();
</script>
